version: '3.7'

# Os valores vêm do arquivo .env (não versionado) por substituição
# ${VAR}. Compose v1 não suporta ${VAR:-default}, mas suporta ${VAR}.
# Copie .env.example para .env e preencha antes de subir.

services:
  # Banco de dados. Sem "ports": o app fala pela rede do compose. Para
  # psql direto, use "127.0.0.1:5432:5432" — nunca "5432:5432".
  kamnews_database:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped

  # Servidor Ollama (modelo local). Os modelos ficam no volume.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Aplicacao FastAPI. O entrypoint espera o banco e o Ollama, roda as
  # migrations, semeia os dados e so entao sobe a API.
  kamnews_app:
    build: .
    depends_on:
      - kamnews_database
      - ollama
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@kamnews_database:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      SEED_EMAIL_DOMAIN: ${SEED_EMAIL_DOMAIN}
      MASTER_EMAIL: ${MASTER_EMAIL}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      SEED_KAM_PASSWORD: ${SEED_KAM_PASSWORD}
      # Vazio = aba Assistente desligada (503 com aviso).
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Nome de serviço interno do compose: não é segredo nem varia.
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TIMEOUT: "150"
    restart: unless-stopped

volumes:
  ollama_data:
  pgdata:
